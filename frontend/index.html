<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>FudanAir Airline Ticketing System</title>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        background:
          radial-gradient(900px 460px at 50% 30%, rgba(54, 198, 255, 0.14), transparent 60%),
          #f2f5fa;
        font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }
      #app-splash .splash-logo {
        width: 264px;
        height: 264px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 18px 45px rgba(20, 45, 85, 0.18);
        animation: splash-float 2.4s ease-in-out infinite;
      }
      #app-splash .splash-bar {
        width: 264px;
        height: 8px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(22, 119, 255, 0.16);
      }
      #app-splash .splash-bar::before {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(120deg, #1c64f2, #36c6ff);
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      #app-splash .splash-text {
        color: #86909c;
        font-size: 13px;
        letter-spacing: 0.04em;
      }
      @keyframes splash-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes splash-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(380%); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-splash">
        <img class="splash-logo" src="/images/brand-emblem.png" alt="FudanAir" />
        <div class="splash-bar"></div>
        <div class="splash-text">FudanAir Airline Ticketing System · Loading</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
